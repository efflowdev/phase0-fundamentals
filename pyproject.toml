[project]
name = "phase0-fundamentals"
version = "0.1.0"
description = "Phase 0 fundamentals exercises and tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "tiktoken>=0.13.0",
    "tqdm>=4.67",
]

# Days 1-4 were scripts in folders, importing each other by accident of
# sys.path[0]. That stops working the moment two days need to share code, which
# is what day 5's runner is. `phase0/` is the one real package; each dayN
# directory stays a set of scripts, because they are exercises, not libraries.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phase0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    # Dev-only, and deliberately so: day 6's tests read docker-compose.yml as
    # data to assert its invariants. Nothing at runtime parses YAML, so this
    # must not land in the image — which is what `uv sync --no-dev` enforces.
    "pyyaml>=6.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["phase0", "day1-bpe", "day2_client", "day3_sampling", "day4_search", "day5_async", "day6_stack"]
